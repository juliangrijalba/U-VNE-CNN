[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uvne_packs"
version = "0.1.0"
description = "CNN urbanphony multilabel"
authors = [
    { name = "Julián Grijalba" }
]
dependencies = [
    "tensorflow",
    "numpy",
    "pandas"
]

[tool.setuptools.packages.find]
where = ["."]